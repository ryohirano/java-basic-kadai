<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="fragment :: head('ログイン')"></head>

<body>
<div class="samuraitravel-wrapper">

    <main>
        <div class="container pt-4 pb-5 samuraitravel-container">
            <div class="row justify-content-center">
                <div class="col-xl-3 col-lg-4 col-md-5 col-sm-7">

                    <h1 class="mb-4 text-center">ログイン</h1>

                    <div th:if="${param.error}" class="alert alert-danger">
                        メールアドレスまたはパスワードに誤りがあります。
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-group mb-3">
                            <input type="text" class="form-control" name="username" placeholder="メールアドレス">
                        </div>

                        <div class="form-group mb-3">
                            <input type="password" class="form-control" name="password" placeholder="パスワード">
                        </div>

                        <div class="d-flex justify-content-center my-4">
                            <button type="submit" class="btn text-white shadow-sm">ログイン</button>
                        </div>
                    </form>

                    <div class="text-center">
                        <a th:href="@{/signup}">会員登録</a>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <div th:replace="fragment :: footer"></div>
</div>

<div th:replace="fragment :: scripts"></div>
</body>
</html>
